# Ejemplo de configuración para tu proxy inverso.
#
# REPARTO. El cockpit ocupa la raíz de su dominio porque es una PWA: el
# service worker toma como alcance la carpeta desde la que se sirve, y el
# start_url del manifiesto y el diálogo de instalación se complican si
# cuelga de un subdirectorio. La API va bajo /api del MISMO dominio, lo que
# elimina el CORS por completo al ser el mismo origen.
#
# La landing, que no tiene esas exigencias, va en otro nombre (o en ninguno,
# si prefieres no publicarla).
#
#   coche.tudominio.com/           → cockpit (PWA)
#   coche.tudominio.com/api/       → backend
#   vehicleos.tudominio.com/       → landing
#
# Ajusta los nombres, las rutas de los certificados y la IP del servidor.

upstream vehicleos_cockpit { server 192.168.1.XXX:7271; }
upstream vehicleos_api     { server 192.168.1.XXX:7272; }
upstream vehicleos_landing { server 192.168.1.XXX:7270; }

# ── Cockpit + API en un solo origen ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name coche.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/coche.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coche.tudominio.com/privkey.pem;

    # Una pantalla de coche envía telemetría continua: sin esto el proxy
    # corta la conexión cada minuto y el cliente reconecta sin parar.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # WebSocket de telemetría. Va antes que /api/ porque nginx da prioridad
    # a la coincidencia más larga, pero se deja explícito por claridad.
    location /api/socket.io/ {
        proxy_pass http://vehicleos_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # API REST. La barra final en proxy_pass es la que quita el prefijo
    # /api antes de llegar al backend, cuyas rutas son planas (/auth/login,
    # /vehicles…). Si la quitas, el backend recibirá /api/auth/login y
    # devolverá 404.
    location /api/ {
        proxy_pass http://vehicleos_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás es el cockpit.
    location / {
        proxy_pass http://vehicleos_cockpit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El service worker no debe cachearse, o un despliegue nuevo tardaría
    # días en llegar a las pantallas ya instaladas.
    location = /sw.js {
        proxy_pass http://vehicleos_cockpit/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ── Landing ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name vehicleos.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/vehicleos.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vehicleos.tudominio.com/privkey.pem;

    location / {
        proxy_pass http://vehicleos_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Redirección de HTTP a HTTPS ─────────────────────────────────────
server {
    listen 80;
    server_name coche.tudominio.com vehicleos.tudominio.com;
    return 301 https://$host$request_uri;
}
