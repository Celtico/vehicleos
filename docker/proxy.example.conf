# Equivalente en nginx del despliegue real de VehicleOS.
#
# Si usas Nginx Proxy Manager, NO uses este fichero: la guía para su
# interfaz está en docs/nginx-proxy-manager.md.
#
#   coche.serverscel.com       → cockpit (PWA)      :7271
#   coche-api.serverscel.com   → API y WebSocket    :7272
#   vehicleos.serverscel.com   → landing            :7270
#
# El backend se despliega con API_PREFIX=/api, así que sirve ya bajo ese
# prefijo: el proxy reenvía la ruta TAL CUAL. Nada de barra final en
# proxy_pass, que la quitaría y provocaría un 404.
#
# Ajusta nombres, rutas de certificados e IP del servidor.

upstream vehicleos_cockpit { server 192.168.1.55:7271; }
upstream vehicleos_api     { server 192.168.1.55:7272; }
upstream vehicleos_landing { server 192.168.1.55:7270; }

# ── Cockpit ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name coche.serverscel.com;

    ssl_certificate     /etc/letsencrypt/live/coche.serverscel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coche.serverscel.com/privkey.pem;

    location / {
        proxy_pass http://vehicleos_cockpit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El service worker no debe cachearse, o un despliegue nuevo tardaría
    # días en llegar a las pantallas ya instaladas.
    location = /sw.js {
        proxy_pass http://vehicleos_cockpit/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ── API y WebSocket ─────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name coche-api.serverscel.com;

    ssl_certificate     /etc/letsencrypt/live/coche-api.serverscel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coche-api.serverscel.com/privkey.pem;

    # Una pantalla de coche mantiene el WebSocket abierto durante horas; con
    # el valor por defecto el proxy lo corta cada minuto y el cliente
    # reconecta sin parar.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://vehicleos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}

# ── Landing ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name vehicleos.serverscel.com;

    ssl_certificate     /etc/letsencrypt/live/vehicleos.serverscel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vehicleos.serverscel.com/privkey.pem;

    location / {
        proxy_pass http://vehicleos_landing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTP a HTTPS ────────────────────────────────────────────────────
#
# OJO: no lo actives si delante hay otro proxy terminando el TLS y
# reenviando en HTTP (Cloudflare en modo Flexible, por ejemplo). En ese
# caso provoca un bucle infinito de redirecciones.
