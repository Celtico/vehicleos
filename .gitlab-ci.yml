# Pipeline de CI/CD de VehicleOS (GitLab CI)
#
# Cada job es autónomo: instala desde la caché del store de pnpm en lugar de
# recibir node_modules como artefacto. Pasar node_modules entre etapas
# (>50.000 archivos) reventaba el límite de subida del servidor con un
# 413 Request Entity Too Large.
#
# Etapas:
#   quality → lint, formato y typecheck
#   build   → compila paquetes, PWA y backend
#   test    → tests de paquetes (vitest) y backend (jest)
#   android → APK del Vehicle Bridge (manual: requiere runner amd64)

stages:
  - quality
  - build
  - test
  - android

variables:
  PNPM_VERSION: "9.5.0"
  # Store de pnpm dentro del workspace para poder cachearlo entre jobs.
  PNPM_HOME: "$CI_PROJECT_DIR/.pnpm-store"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

# Plantilla común de los jobs de Node.
.node:
  image: node:20-bookworm-slim
  before_script:
    # Prisma necesita OpenSSL para elegir su motor; sin él avisa y puede fallar.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends openssl ca-certificates
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set store-dir "$PNPM_HOME"
    - pnpm install --frozen-lockfile --prefer-offline
    # El cliente de Prisma es código generado: hace falta antes de compilar.
    - pnpm --filter @vehicleos/backend run prisma:generate
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull

lint:
  extends: .node
  stage: quality
  needs: []
  # Primer job del pipeline: es el que rellena la caché para los demás.
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
    policy: pull-push
  script:
    - pnpm lint

formato:
  extends: .node
  stage: quality
  needs: []
  script:
    - pnpm prettier --check "**/*.{ts,tsx,md,json}"

typecheck:
  extends: .node
  stage: quality
  needs: []
  script:
    - pnpm typecheck

build:
  extends: .node
  stage: build
  needs: []
  script:
    - pnpm build

test:
  extends: .node
  stage: test
  needs: []
  script:
    - pnpm test

# El bridge Android vive fuera de pnpm/turbo y se compila con Gradle.
#
# MANUAL a propósito: las build-tools del SDK de Android solo existen para
# x86_64, así que este job no puede completarse en un runner arm64 (como un
# Mac con Apple Silicon). Lánzalo a mano en un runner amd64, o compila el APK
# en local con `cd apps/android-bridge && ./gradlew assembleDebug`.
android-bridge:
  stage: android
  image: eclipse-temurin:17-jdk
  needs: []
  when: manual
  allow_failure: true
  rules:
    - exists:
        - apps/android-bridge/gradlew
  variables:
    ANDROID_HOME: /sdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends unzip wget ca-certificates
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/tools.zip
    - mkdir -p $ANDROID_HOME/cmdline-tools && unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    # sdkmanager cierra la tubería antes de consumir todo el "yes" y provoca
    # un SIGPIPE (código 141); se ignora a propósito.
    - (yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1) || true
  script:
    - cd apps/android-bridge
    - ./gradlew assembleDebug --no-daemon
  artifacts:
    expire_in: 1 week
    paths:
      - apps/android-bridge/app/build/outputs/apk/debug/*.apk
